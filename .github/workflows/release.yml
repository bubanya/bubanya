name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri build -- --bundles appimage

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/Bubanya-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/Bubanya-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "artifacts\Bubanya-windows-x64-setup.exe"
          Copy-Item "src-tauri\target\release\bubanya.exe" "artifacts\Bubanya.exe"
          @"
          Bubanya 0.1.0 for Windows x64

          Run Bubanya.exe or the setup installer.
          Microsoft Edge WebView2 Runtime is required.
          Data: %APPDATA%\Bubanya
          "@ | Out-File -Encoding utf8 "artifacts\README.txt"
          Compress-Archive -Path "artifacts\Bubanya.exe", "artifacts\README.txt" `
            -DestinationPath "artifacts\Bubanya-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Bubanya ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
